<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineScope - Movie Discovery Dashboard</title>
    <!-- Normalize CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="styles.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
        
    <!-- FEATURE 1: Sticky Navigation Bar -->
    <header class="main-header">
        <div class="container navbar">
            <!-- Logo  -->
            <a href="#" class="logo-container">
                <!-- SVG Logo -->
                <svg 
                    xmlns="http://www.w3.org/2000/svg" 
                    width="24" 
                    height="24" 
                    viewBox="0 0 24 24" 
                    fill="none" stroke="currentColor" 
                    stroke-width="2.5" 
                    stroke-linecap="round" 
                    stroke-linejoin="round" 
                    class="logo-icon"
                >
                    <rect width="18" height="18" x="3" y="3" rx="2" />
                    <path d="M7 3v18" />
                    <path d="M17 3v18" />
                    <path d="M3 7h4" />
                    <path d="M17 7h4" />
                    <path d="M3 12h18" />
                    <path d="M3 17h4" />
                    <path d="M17 17h4" />
                </svg>
                <span>CineScope</span>
            </a>
            
            <!-- Navigation Links -->
            <nav class="nav-links">
                <a href="#trending" class="nav-link active">
                    Trending
                </a>
                <a href="#search" class="nav-link">
                    Search
                </a>
                <!-- Theme Toggle Button -->
                <button id="themeToggleBtn" class="theme-toggle-btn" aria-label="Toggle Theme">
                    <i data-lucide="sun" id="themeIcon"></i>
                </button>

            </nav>
        
        </div>
    
    </header>

    <main>
        <!-- FEATURE 2: Hero / Banner Section -->
        <section class="hero-section" id="trending">
            <div class="hero-overlay">
                <div class="hero-content">
                    <p class="hero-tag">
                        TRENDING NOW
                    </p>
                    <h1 class="hero-title">
                        MOVIE NAME
                    </h1>
                    <p class="hero-meta">
                        Release Year | Genre | Rating
                    <p class="hero-description">
                        A brief description of the movie goes here. This is a captivating summary that entices users to explore more about the film.
                    </p>
                    <button class="hero-button">
                        <i data-lucide="info"></i>
                        View Details
                    </button>
                </div>
            </div>
        </section>

        <!-- FEATURE 3: Discover Section (Search + Genre Filters)-->
        <section class="discover-section">
            <!-- Search -->
            <div class="search-container">
                <i data-lucide="search" class="search-icon"></i>
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search movies..."
                >
            </div>

            <!-- Genre Filters -->
            <div class="genre-filters">
                <button class="genre-btn active"> All </button>

                <button class="genre-btn"> Action </button>

                <button class="genre-btn"> Comedy </button>

                <button class="genre-btn"> Sci-Fi </button>
                
                <button class="genre-btn"> Drama </button>

                <button class="genre-btn"> Thriller </button>
            </div>
        </section>
    </main>

    <!-- Main JavaScript -->
    <script src="app.js"></script>

    <!-- Lucide Icons Initialization -->
    <script>
        lucide.createIcons();
    </script>

</body>
</html>
